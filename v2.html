<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>입퇴원현황(정신건강팀) · 가상 로그인</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f9fc;color:#253345;font:15px/1.6 'Malgun Gothic',sans-serif}.card{width:min(460px,calc(100% - 32px));padding:28px;background:#fff;border:1px solid #dce3ec;border-radius:8px}h1{margin:0 0 8px;font-size:22px}button{font:inherit;padding:9px 13px;border:1px solid #176b5c;border-radius:4px;background:#176b5c;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#googleSignIn{min-height:42px;margin:18px 0}#state{min-height:24px;color:#52667d;font-size:13px}.notice{color:#755b1b;background:#fff8e9;padding:10px;border:1px solid #ead6a0;font-size:13px}</style>
<main class="card">
  <h1>입퇴원현황(정신건강팀)</h1>
  <p class="notice">가상 시험입니다. 실제 대상자 정보는 입력하지 마세요.</p>
  <button id="openBackend" type="button">업무 화면 열기</button>
  <div id="googleSignIn" aria-label="Google 계정 로그인"></div>
  <p id="state" role="status">업무 화면을 연 뒤 Google 계정으로 로그인하세요.</p>
</main>
<script>
window.__ADMISSION_V2_SHELL_CONFIG__=Object.freeze({
  clientId:'1049058766076-33417p06nrftlfgpt611f52s9tjiusg3.apps.googleusercontent.com',
  backendFrameUrl:'https://script.google.com/macros/s/AKfycby-XvAd35tk-hwJY77Now7ULN_hALnixUYRv-oazScNhQvBvwgg-iFZZ6nvwiEI0_HH/exec',
  backendOuterOrigin:'https://script.google.com',
  backendOrigins:Object.freeze(['https://n-6ww4tfnonxy3eaixrxcs6npuz5b577rfj4efx7q-0lu-script.googleusercontent.com','https://n-6ww4tfnonxy3eaixrxcs6npuz5b577rfj4efx7q-1lu-script.googleusercontent.com'])
});
(()=>{'use strict';
  const config=window.__ADMISSION_V2_SHELL_CONFIG__,state=document.getElementById('state'),openBackend=document.getElementById('openBackend');
  let backendReady=false,backendOrigin='',backendWindow=null,pendingCredential='',channel='';
  function show(value){state.textContent=value;}
  function createChannel(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return Array.from(bytes,byte=>byte.toString(16).padStart(2,'0')).join('');}
  function validConfig(value){if(!value||typeof value!=='object'||Array.isArray(value)||Object.keys(value).sort().join(',')!=='backendFrameUrl,backendOrigins,backendOuterOrigin,clientId'||value.backendOuterOrigin!=='https://script.google.com'||typeof value.clientId!=='string'||!/^[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com$/.test(value.clientId)||!Array.isArray(value.backendOrigins)||value.backendOrigins.length!==2||new Set(value.backendOrigins).size!==2||!value.backendOrigins.every(origin=>/^https:\/\/n-6ww4tfnonxy3eaixrxcs6npuz5b577rfj4efx7q-[01]lu-script\.googleusercontent\.com$/.test(origin)))return false;try{const url=new URL(value.backendFrameUrl);return url.origin===value.backendOuterOrigin&&/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)&&!url.search&&!url.hash;}catch(_){return false;}}
  function sendCredential(){if(!backendReady||!pendingCredential||!channel||!backendOrigin||!backendWindow||backendWindow.closed)return;const credential=pendingCredential;pendingCredential='';backendWindow.postMessage({type:'ADMISSION_V2_ID_TOKEN',channel,credential},backendOrigin);show('신원을 확인하는 중입니다. 업무 화면을 닫지 마세요.');}
  function onCredential(response){const credential=response&&response.credential;if(typeof credential!=='string'||credential.length<20||credential.length>8192){show('로그인 정보를 확인하지 못했습니다. 다시 시도하세요.');return;}pendingCredential=credential;if(backendReady)sendCredential();else show('안전한 업무 화면 연결을 기다리는 중입니다.');}
  function loadGoogleIdentity(){const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;script.defer=true;script.addEventListener('load',()=>{if(!window.google||!google.accounts||!google.accounts.id){show('로그인 기능을 불러오지 못했습니다.');return;}google.accounts.id.initialize({client_id:config.clientId,callback:onCredential,auto_select:false,cancel_on_tap_outside:true});google.accounts.id.renderButton(document.getElementById('googleSignIn'),{theme:'outline',size:'large',text:'signin_with',width:260});});script.addEventListener('error',()=>show('로그인 기능을 불러오지 못했습니다.'));document.head.append(script);}
  function openBackendWindow(){backendReady=false;backendOrigin='';backendWindow=null;channel=createChannel();const popup=window.open(config.backendFrameUrl,'admission-v2-backend','popup=yes,width=1280,height=840');if(!popup){show('업무 화면을 열지 못했습니다. 팝업 차단을 해제한 뒤 다시 시도하세요.');return;}openBackend.disabled=true;show('업무 화면 연결을 기다리는 중입니다.');}
  window.addEventListener('message',event=>{const message=event.data;if(!config.backendOrigins.includes(event.origin)||!message||typeof message!=='object'||Array.isArray(message))return;if(message.type==='ADMISSION_V2_BACKEND_WAITING'&&backendWindow===null&&Object.keys(message).sort().join(',')==='type'){backendWindow=event.source;backendOrigin=event.origin;backendWindow.postMessage({type:'ADMISSION_V2_BRIDGE_INIT',channel},backendOrigin);return;}if(event.source!==backendWindow||event.origin!==backendOrigin||message.channel!==channel)return;if(message.type==='ADMISSION_V2_BACKEND_READY'&&Object.keys(message).sort().join(',')==='channel,type'){backendReady=true;openBackend.disabled=false;show('업무 화면이 준비되었습니다. Google 계정으로 로그인하세요.');sendCredential();return;}if(message.type==='ADMISSION_V2_AUTHENTICATED'&&Object.keys(message).sort().join(',')==='channel,type'){pendingCredential='';show('신원 확인 완료. 업무 화면에서 계속하세요.');}});
  if(!validConfig(config)){show('가상 로그인 설정을 확인해야 합니다.');return;}
  openBackend.addEventListener('click',openBackendWindow);loadGoogleIdentity();
})();
</script>
</html>
