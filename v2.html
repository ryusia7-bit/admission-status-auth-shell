<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>입퇴원현황(정신건강팀) · 가상 로그인</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f9fc;color:#253345;font:15px/1.6 'Malgun Gothic',sans-serif}.card{width:min(460px,calc(100% - 32px));padding:28px;background:#fff;border:1px solid #dce3ec;border-radius:8px}h1{margin:0 0 8px;font-size:22px}button{font:inherit;padding:9px 13px;border:1px solid #176b5c;border-radius:4px;background:#176b5c;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#googleSignIn{min-height:42px;margin:18px 0}#state{min-height:24px;color:#52667d;font-size:13px}.notice{color:#755b1b;background:#fff8e9;padding:10px;border:1px solid #ead6a0;font-size:13px}</style>
<main class="card">
  <h1>입퇴원현황(정신건강팀)</h1>
  <p class="notice">가상 시험입니다. 실제 대상자 정보는 입력하지 마세요.</p>
  <div id="googleSignIn" aria-label="Google 계정 로그인"></div>
  <p id="state" role="status">Google 계정으로 로그인하세요.</p>
</main>
<script>
window.__ADMISSION_V2_SHELL_CONFIG__=Object.freeze({
  clientId:'1049058766076-33417p06nrftlfgpt611f52s9tjiusg3.apps.googleusercontent.com',
  backendFrameUrl:'https://script.google.com/macros/s/AKfycby-XvAd35tk-hwJY77Now7ULN_hALnixUYRv-oazScNhQvBvwgg-iFZZ6nvwiEI0_HH/exec'
});
(()=>{'use strict';
  const config=window.__ADMISSION_V2_SHELL_CONFIG__,state=document.getElementById('state');
  function show(value){state.textContent=value;}
  function validConfig(value){if(!value||typeof value!=='object'||Array.isArray(value)||Object.keys(value).sort().join(',')!=='backendFrameUrl,clientId'||typeof value.clientId!=='string'||!/^[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com$/.test(value.clientId))return false;try{const url=new URL(value.backendFrameUrl);return url.origin==='https://script.google.com'&&/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)&&!url.search&&!url.hash;}catch(_){return false;}}
  function submitCredential(credential){const form=document.createElement('form'),input=document.createElement('input');form.method='post';form.action=config.backendFrameUrl;form.target='_self';input.type='hidden';input.name='credential';input.value=credential;form.append(input);document.body.append(form);form.submit();show('신원을 확인하는 중입니다.');}
  function onCredential(response){const credential=response&&response.credential;if(typeof credential!=='string'||credential.length<20||credential.length>8192){show('로그인 정보를 확인하지 못했습니다. 다시 시도하세요.');return;}submitCredential(credential);}
  function loadGoogleIdentity(){const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;script.defer=true;script.addEventListener('load',()=>{if(!window.google||!google.accounts||!google.accounts.id){show('로그인 기능을 불러오지 못했습니다.');return;}google.accounts.id.initialize({client_id:config.clientId,callback:onCredential,auto_select:false,cancel_on_tap_outside:true});google.accounts.id.renderButton(document.getElementById('googleSignIn'),{theme:'outline',size:'large',text:'signin_with',width:260});});script.addEventListener('error',()=>show('로그인 기능을 불러오지 못했습니다.'));document.head.append(script);}
  if(!validConfig(config)){show('가상 로그인 설정을 확인해야 합니다.');return;}
  loadGoogleIdentity();
})();
</script>
</html>
