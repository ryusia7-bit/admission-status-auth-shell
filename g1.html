<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입퇴원현황(정신건강팀) · 가상 시험 로그인</title>
  <style>
    :root{font-family:"Malgun Gothic",Arial,sans-serif;color:#20323f;background:#f3f7fa}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(480px,calc(100% - 32px));background:#fff;border:1px solid #cbd8e3;box-shadow:0 8px 28px #21394a18}header{padding:22px 26px;background:#0f766e;color:#fff}h1{margin:0;font-size:22px}.content{padding:26px}p{line-height:1.65}.notice{padding:12px;background:#fff8e9;border:1px solid #ead6a0;color:#674d16}#openBackend{margin-top:18px;border:1px solid #0f766e;background:#0f766e;color:#fff;padding:10px 14px;border-radius:4px;font:inherit;cursor:pointer}#openBackend:disabled{opacity:.55;cursor:wait}#googleSignIn{min-height:42px;margin:18px 0}#state{color:#546574;font-size:13px}footer{margin-top:18px;color:#697985;font-size:12px}
  </style>
</head>
<body>
  <main>
    <header><h1>입퇴원현황(정신건강팀)</h1></header>
    <div class="content">
      <p>가상 시험용 승인 계정을 확인한 뒤 해당 병원의 업무 화면으로 이동합니다.</p>
      <p class="notice">가상 시험입니다. 실제 대상자 정보는 입력하지 마세요.</p>
      <button id="openBackend" type="button">업무 화면 열기</button>
      <div id="googleSignIn" aria-label="Google 로그인"></div>
      <p id="state" role="status" aria-live="polite">먼저 업무 화면을 열어주세요.</p>
      <footer>신원 토큰은 저장하거나 화면에 표시하지 않습니다.</footer>
    </div>
  </main>
  <script>
    window.__ADMISSION_G1_AUTH_SHELL_CONFIG__=Object.freeze({
      backendFrameUrl:'https://script.google.com/macros/s/AKfycbwA5XuZLR7qXzyX6-QLIIzlujjsxaE29JCRLwYh7RkGTWJGNZ7tEQom1t5vtqjGH9S5-A/exec',
      backendOuterOrigin:'https://script.google.com',
      backendOrigins:Object.freeze(['https://n-i24xh4pxyufnqkgzkosr5bflorb577rfj4efx7q-0lu-script.googleusercontent.com','https://n-i24xh4pxyufnqkgzkosr5bflorb577rfj4efx7q-1lu-script.googleusercontent.com']),
      clientId:'1049058766076-33417p06nrftlfgpt611f52s9tjiusg3.apps.googleusercontent.com'
    });
    (()=>{'use strict';
      const state=document.getElementById('state'),openBackend=document.getElementById('openBackend'),config=window.__ADMISSION_G1_AUTH_SHELL_CONFIG__;
      let backendReady=false,backendOrigin='',popupWindow=null,backendWindow=null,pendingCredential='',channel='';
      function show(value){state.textContent=value;}
      function createChannel(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return Array.from(bytes,byte=>byte.toString(16).padStart(2,'0')).join('');}
      function validConfig(value){if(!value||typeof value!=='object'||Array.isArray(value)||Object.keys(value).sort().join(',')!=='backendFrameUrl,backendOrigins,backendOuterOrigin,clientId')return false;if(typeof value.clientId!=='string'||! /^[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com$/.test(value.clientId)||typeof value.backendOuterOrigin!=='string'||value.backendOuterOrigin!=='https://script.google.com'||!Array.isArray(value.backendOrigins)||value.backendOrigins.length!==2||new Set(value.backendOrigins).size!==2||!value.backendOrigins.every(origin=>/^https:\/\/n-i24xh4pxyufnqkgzkosr5bflorb577rfj4efx7q-[01]lu-script\.googleusercontent\.com$/.test(origin))||typeof value.backendFrameUrl!=='string')return false;try{const url=new URL(value.backendFrameUrl);return url.origin===value.backendOuterOrigin&&/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)&&!url.search&&!url.hash;}catch(_){return false;}}
      function sendCredential(){if(!backendReady||!pendingCredential||!channel||!backendOrigin||!backendWindow||backendWindow.closed)return;const credential=pendingCredential;pendingCredential='';backendWindow.postMessage({type:'ADMISSION_G1_ID_TOKEN',channel,credential},config.backendOuterOrigin);show('신원을 확인하고 있습니다. 업무 화면을 닫지 마세요.');}
      function onCredential(response){const credential=response&&response.credential;if(typeof credential!=='string'||credential.length<20||credential.length>8192){show('로그인 정보를 확인하지 못했습니다. 다시 시도하세요.');return;}pendingCredential=credential;if(backendReady)sendCredential();else show('안전한 업무 화면 연결을 기다리는 중입니다.');}
      function loadGoogleIdentity(){const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;script.defer=true;script.addEventListener('load',()=>{if(!window.google||!google.accounts||!google.accounts.id){show('로그인 기능을 불러오지 못했습니다.');return;}google.accounts.id.initialize({client_id:config.clientId,callback:onCredential,cancel_on_tap_outside:true});google.accounts.id.renderButton(document.getElementById('googleSignIn'),{theme:'outline',size:'large',text:'signin_with',width:260});show('Google 계정으로 로그인하세요.');});script.addEventListener('error',()=>show('로그인 기능을 불러오지 못했습니다.'));document.head.append(script);}
      if(window.top!==window.self){show('직접 연 로그인 화면에서만 사용할 수 있습니다.');return;}
      if(!validConfig(config)){show('가상 시험 설정이 없어 로그인할 수 없습니다.');return;}
      function openBackendWindow(){if(popupWindow&&!popupWindow.closed){popupWindow.focus();return;}backendReady=false;backendOrigin='';backendWindow=null;channel=createChannel();popupWindow=window.open(config.backendFrameUrl,'admission-g1-backend','popup=yes,width=1280,height=840');if(!popupWindow){show('업무 화면을 열지 못했습니다. 팝업 차단을 해제한 뒤 다시 시도하세요.');return;}openBackend.disabled=true;show('업무 화면 연결을 기다리는 중입니다.');}
      window.addEventListener('message',event=>{const message=event.data;if(!message||typeof message!=='object'||Array.isArray(message))return;if(message.type==='ADMISSION_G1_BACKEND_WAITING'){console.warn('G1_BRIDGE_WAITING',event.origin,event.source===popupWindow);if(backendWindow===null&&Object.keys(message).sort().join(',')==='type'){if(config.backendOrigins.includes(event.origin)||(event.origin===config.backendOuterOrigin&&event.source===popupWindow)){backendWindow=event.source;backendOrigin=event.origin;backendWindow.postMessage({type:'ADMISSION_G1_BRIDGE_INIT',channel},config.backendOuterOrigin);}}return;}if(event.source!==backendWindow||event.origin!==backendOrigin||message.channel!==channel)return;if(message.type==='ADMISSION_G1_BACKEND_READY'&&Object.keys(message).sort().join(',')==='channel,type'){backendReady=true;openBackend.disabled=false;show('업무 화면이 준비되었습니다. Google 계정으로 로그인하세요.');sendCredential();return;}if(message.type==='ADMISSION_G1_AUTHENTICATED'&&Object.keys(message).sort().join(',')==='channel,type'){pendingCredential='';show('신원 확인 완료. 업무 화면에서 계속하세요.');}});
      openBackend.addEventListener('click',openBackendWindow);
      loadGoogleIdentity();
    })();
  </script>
</body>
</html>
